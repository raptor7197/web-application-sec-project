name: Nightly Deep DAST Scan

on:
  schedule:
    # Runs at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  NODE_VERSION: '18'

jobs:
  dast-full-scan:
    name: 'DAST: OWASP ZAP Full Active Scan'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start services
        run: |
          cd backend && npm ci && node server.js &
          cd frontend && npm ci && npx vite --port 5173 &
          sleep 5
          timeout 30 bash -c 'until curl -s http://localhost:3001/api/health > /dev/null 2>&1; do sleep 1; done'
          echo "Services ready"

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.14.1
        with:
          target: 'http://localhost:5173'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >
            -a
            -j
            -T 5
            -d
          fail_action: false  # No gate - informational report
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZAP Full Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-zap-full-report
          path: zap-report.html

      - name: Upload ZAP SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: zap-report.sarif
          category: zap-full-scan
